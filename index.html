<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <title>Skriver ut...</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <iframe id="pdf"></iframe>

  <script>

    const params =
      new URLSearchParams(
        window.location.search
      );

    const file =
      params.get("file");

    if (!file) {
      document.body.innerText =
        "Ingen PDF angiven.";
    } else {

      const pdfUrl =
        "pdf/" +
        encodeURIComponent(file);

      const iframe =
        document.getElementById("pdf");

      iframe.src = pdfUrl;

      setTimeout(function() {

        window.print();

      }, 3000);

    }

  </script>

</body>

</html>
