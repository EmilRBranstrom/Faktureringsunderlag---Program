name: Skapa PDF

on:
  workflow_dispatch:
    inputs:
      tex_file:
        description: "LaTeX-fil som ska kompileras"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Hämta repository
      # ------------------------------------------------------

      - name: Hämta repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Cache för hela TinyTeX
      # ------------------------------------------------------

      - name: Cachea TinyTeX
        id: cache-tinytex
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: ${{ runner.os }}-tinytex-v1

      # ------------------------------------------------------
      # Installera TinyTeX om cachen saknas
      # ------------------------------------------------------

      - name: Installera TinyTeX
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: |
          wget -qO- \
            "https://yihui.org/tinytex/install-bin-unix.sh" \
            | sh

      # ------------------------------------------------------
      # Lägg TinyTeX i PATH
      # ------------------------------------------------------

      - name: Lägg till TinyTeX i PATH
        run: |
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> $GITHUB_PATH

      # ------------------------------------------------------
      # Installera LaTeX-paket om cachen saknas
      # ------------------------------------------------------

      - name: Installera LaTeX-paket
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: |
          tlmgr install \
            babel-swedish \
            graphics \
            tools \
            booktabs \
            geometry \
            xcolor

      # ------------------------------------------------------
      # Kompilera LaTeX
      # ------------------------------------------------------

      - name: Kompilera LaTeX
        run: |
          pdflatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            "${{ inputs.tex_file }}"

      # ------------------------------------------------------
      # Bestäm PDF-filens namn
      # ------------------------------------------------------

      - name: Bestäm PDF-fil
        id: pdf
        run: |
          pdf_file="${{ inputs.tex_file%.tex }}.pdf"
          echo "pdf_file=$pdf_file" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------
      # Spara PDF
      # ------------------------------------------------------

      - name: Spara PDF
        uses: actions/upload-artifact@v4
        with:
          name: Faktureringsunderlag
          path: ${{ steps.pdf.outputs.pdf_file }}
          if-no-files-found: error
