name: Skapa PDF

on:
  workflow_dispatch:
    inputs:
      tex_file:
        description: "LaTeX-fil som ska kompileras"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Cachea TinyTeX
        id: cache-tinytex
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: ${{ runner.os }}-tinytex-v1

      - name: Installera TinyTeX
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: |
          wget -qO- \
            "https://yihui.org/tinytex/install-bin-unix.sh" \
            | sh

      - name: Lägg till TinyTeX i PATH
        run: |
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> $GITHUB_PATH

      - name: Installera LaTeX-paket
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: |
          tlmgr install \
            babel-swedish \
            graphics \
            tools \
            booktabs \
            geometry \
            xcolor

      - name: Kontrollera fil
        run: |
          echo "Filen som ska kompileras:"
          echo "${{ inputs.tex_file }}"
          echo
          ls -lh "${{ inputs.tex_file }}"

      - name: Kompilera LaTeX
        run: |
          pdflatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            "${{ inputs.tex_file }}"

      - name: Bestäm PDF-fil
        id: pdf
        shell: bash
        run: |
          tex_file="${{ inputs.tex_file }}"
          pdf_file="${tex_file%.tex}.pdf"
          echo "pdf_file=$pdf_file" >> "$GITHUB_OUTPUT"
          echo "PDF: $pdf_file"

      - name: Spara PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pdf.outputs.pdf_file }}
          path: ${{ steps.pdf.outputs.pdf_file }}
          if-no-files-found: error

      - name: Publicera PDF i repository
        run: |
          mkdir -p pdf

          cp "${{ steps.pdf.outputs.pdf_file }}" \
             "pdf/${{ steps.pdf.outputs.pdf_file }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pdf/

          git commit \
            -m "Publicera PDF ${{ steps.pdf.outputs.pdf_file }}" \
            || echo "Inga ändringar att committa"

          git pull --rebase origin main

          git push origin main

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Hämta PDF-filer
        uses: actions/download-artifact@v4
        with:
          path: pdf
          pattern: "*.pdf"
          merge-multiple: true

      - name: Skapa Pages-mapp
        run: |
          mkdir -p pages
          cp index.html pages/
          cp pdf/*.pdf pages/

      - name: Publicera GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy till GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
