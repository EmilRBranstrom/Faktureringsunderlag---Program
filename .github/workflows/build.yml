name: Skapa PDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Cachea APT-paket
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-texlive-apt-v1
          restore-keys: |
            ${{ runner.os }}-texlive-apt-

      - name: Installera LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-lang-european

      - name: Kompilera LaTeX
        run: |
          pdflatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            Faktureringsunderlag.tex

      - name: Spara PDF
        uses: actions/upload-artifact@v4
        with:
          name: Faktureringsunderlag
          path: Faktureringsunderlag.pdf
          if-no-files-found: error
