name: Skapa PDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Installera LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-lang-european

      - name: Kompilera LaTeX
        run: |
          pdflatex \
            -interaction=nonstopmode \
            -halt-on-error \
            Faktureringsunderlag.tex

      - name: Spara PDF som artifact
        uses: actions/upload-artifact@v4
        with:
          name: Faktureringsunderlag
          path: Faktureringsunderlag.pdf
