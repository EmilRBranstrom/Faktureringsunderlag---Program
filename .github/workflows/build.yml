name: Skapa PDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: danteev/texlive:2025

    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Kompilera LaTeX
        run: |
          pdflatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            Faktureringsunderlag.tex

      - name: Spara PDF
        uses: actions/upload-artifact@v4
        with:
          name: Faktureringsunderlag
          path: Faktureringsunderlag.pdf
          if-no-files-found: error
