name: Skapa PDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Hämta repository
      # ------------------------------------------------------

      - name: Hämta repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Cache för hela TinyTeX
      # ------------------------------------------------------

      - name: Cachea TinyTeX
        id: cache-tinytex
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: ${{ runner.os }}-tinytex-v1

      # ------------------------------------------------------
      # Installera TinyTeX om cachen saknas
      # ------------------------------------------------------

      - name: Installera TinyTeX
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: |
          wget -qO- \
            "https://yihui.org/tinytex/install-bin-unix.sh" \
            | sh

      # ------------------------------------------------------
      # Lägg TinyTeX i PATH
      # ------------------------------------------------------

      - name: Lägg till TinyTeX i PATH
        run: |
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> $GITHUB_PATH

      # ------------------------------------------------------
      # Installera de LaTeX-paket som vår mall behöver
      # ------------------------------------------------------

      - name: Installera LaTeX-paket
        run: |
          tlmgr install \
            babel-swedish \
            graphics \
            tools \
            booktabs \
            tabularx \
            geometry \
            xcolor

      # ------------------------------------------------------
      # Kompilera PDF
      # ------------------------------------------------------

      - name: Kompilera LaTeX
        run: |
          pdflatex \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            Faktureringsunderlag.tex

      # ------------------------------------------------------
      # Spara PDF
      # ------------------------------------------------------

      - name: Spara PDF
        uses: actions/upload-artifact@v4
        with:
          name: Faktureringsunderlag
          path: Faktureringsunderlag.pdf
          if-no-files-found: error
